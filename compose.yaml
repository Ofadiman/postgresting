x-jwt-secret: &jwt-secret dummy-jwt-secret-for-local-dev-only

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: postgresting
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      JWT_SECRET: *jwt-secret
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --host=127.0.0.1 --username=admin --dbname=postgresting"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    image: postgrest/postgrest:v16.4
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:mysecretpassword@db:5432/postgresting
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: anonymous
      PGRST_JWT_SECRET: *jwt-secret
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"

  swagger:
    image: swaggerapi/swagger-ui:v5.33.1
    depends_on:
      - api
    volumes:
      - ./swagger/index.html:/usr/share/nginx/html/index.html:ro
      - ./swagger/postgrest-initializer.js:/usr/share/nginx/html/postgrest-initializer.js:ro
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
