x-jwt-secret: &jwt-secret dummy-jwt-secret-for-local-dev-only

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: postgresting
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      JWT_SECRET: *jwt-secret
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --host=127.0.0.1 --username=admin --dbname=postgresting"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:25432:5432"

  api:
    image: postgrest/postgrest:v16.4
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:mysecretpassword@db:5432/postgresting
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: anonymous
      PGRST_JWT_SECRET: *jwt-secret
    ports:
      - "127.0.0.1:25000:3000"

  web:
    build: .
    init: true
    ports:
      - "127.0.0.1:25173:25173"
    develop:
      watch:
        - action: sync
          path: ./app
          target: /home/ofadiman/postgresting/app
        - action: sync
          path: ./public
          target: /home/ofadiman/postgresting/public
        - action: rebuild
          path: mise.toml
        - action: rebuild
          path: package.json
        - action: rebuild
          path: pnpm-lock.yaml
        - action: rebuild
          path: pnpm-workspace.yaml
        - action: rebuild
          path: .npmrc
        - action: rebuild
          path: tsconfig.json
        - action: rebuild
          path: vite.config.ts
        - action: rebuild
          path: react-router.config.ts

volumes:
  pgdata:
